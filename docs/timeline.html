<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenGoodies – Timeline du projet</title>
<style>
:root{
  --bg:#F4F7F3; --surface:#FFFFFF; --ink:#1E2A22; --muted:#5E6E63; --line:#D5E0D7;
  --green:#4A7C59; --green-dark:#2F5A3D; --green-soft:#E3EFE5; --todo:#B8C4BB;
  --code:#EEF3EF; --shadow:0 10px 28px -14px rgba(30,42,34,.35);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121815; --surface:#1B231E; --ink:#E4ECE6; --muted:#9BAAA0; --line:#2C3830;
    --green:#6FA580; --green-dark:#8CC29C; --green-soft:#22332A; --todo:#3D4A42;
    --code:#141B17; --shadow:0 10px 28px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55}
code,pre{font-family:Consolas,"Cascadia Mono",monospace;font-size:.9em}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

/* En-tête */
header{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;padding:44px 0 36px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:1.05rem;font-weight:600;opacity:.95}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#fff;color:var(--green-dark);font-family:Georgia,serif;font-size:1.2rem}
h1{margin:14px 0 6px;font-size:2rem;line-height:1.2}
.sub{margin:0;opacity:.9}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tags span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:3px 12px;border-radius:99px;font-size:.85rem}

/* Barre d'outils */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
.progress{flex:1;min-width:180px}
.progress small{color:var(--muted)}
.track{height:8px;background:var(--green-soft);border-radius:99px;overflow:hidden;margin-top:4px}
.fill{height:100%;background:var(--green);border-radius:99px;transition:width .6s}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--green);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--green-dark);border:1px solid var(--line)}
button:focus-visible{outline:3px solid var(--green-dark);outline-offset:2px}

/* Frise */
.timeline{position:relative;margin:36px 0 60px;padding-left:44px}
.timeline::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.step{position:relative;margin-bottom:18px}
.dot{position:absolute;left:-44px;top:14px;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:.9rem;background:var(--surface);border:3px solid var(--todo);color:var(--muted)}
.step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
.step.current .dot{border-color:var(--green);color:var(--green-dark);box-shadow:0 0 0 5px var(--green-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.step.todo .card{box-shadow:none;opacity:.7}
.head{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;color:inherit;padding:16px 18px;border-radius:0;font-weight:400}
.head h2{margin:0;font-size:1.1rem;flex:1}
.head .date{color:var(--muted);font-size:.85rem}
.badge{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--green-soft);color:var(--green-dark)}
.step.todo .badge{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chev{transition:transform .25s;color:var(--muted)}
.step.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.step.open .body{display:block}
.goal{font-size:1.02rem;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.box{background:var(--bg);border-radius:10px;padding:12px 14px}
.box h3{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--green-dark)}
.box ul{margin:0;padding-left:18px}
.box li{margin:3px 0}
.box.full{grid-column:1/-1}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.cmd-note{color:var(--muted);font-size:.88rem;margin:4px 0 10px}
.qa dt{font-weight:600;margin-top:8px}
.qa dd{margin:2px 0 0;color:var(--muted)}

/* Schéma « feuilles Excel » */
.schema-intro{margin:0 0 12px;color:var(--muted)}
.sheets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.sheets{grid-template-columns:1fr}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet h4{margin:0;padding:8px 12px;font-size:.95rem;border-bottom:1px solid var(--line)}
.sheet h4 small{font-weight:400;color:var(--muted)}
.sheet table{width:100%;border-collapse:collapse;font-size:.85rem}
.sheet th{text-align:left;font-weight:600;color:var(--muted);padding:5px 10px;background:var(--bg)}
.sheet td{padding:5px 10px;border-top:1px solid var(--line)}
.pill{display:inline-block;padding:0 9px;border-radius:99px;font-weight:700;font-size:.82rem}
.pill.u{background:#EEEDFE;color:#3C3489}.pill.o{background:#E1F5EE;color:#085041}.pill.p{background:#FAECE7;color:#712B13}
.st{display:inline-block;padding:0 9px;border-radius:99px;font-size:.82rem;font-weight:600}
.st.cart,.fbox.cart{background:#FAEEDA;color:#633806}.st.ok,.fbox.ok{background:#EAF3DE;color:#27500A}
.erows{display:flex;flex-direction:column;gap:14px}
.erow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start;border-radius:12px;scroll-margin:90px}
@media (max-width:760px){.erow{grid-template-columns:1fr}}
.erow .sheet{overflow-x:auto}
.erow.flash .sheet,.erow.flash .rels{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--green)}100%{box-shadow:0 0 0 0 transparent}}
.rels{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.rels h5{margin:0 0 6px;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rel + .rel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.kind{display:inline-block;font-size:.72rem;font-weight:700;color:var(--green-dark);background:var(--green-soft);padding:1px 8px;border-radius:99px;margin-bottom:6px}
.rels.none .kind{background:transparent;border:1px solid var(--line);color:var(--muted)}
.rel-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:Consolas,"Cascadia Mono",monospace;font-size:.82rem}
.col{padding:1px 8px;border-radius:6px;font-weight:600}
.col.u{background:#EEEDFE;color:#3C3489}.col.o{background:#E1F5EE;color:#085041}.col.p{background:#FAECE7;color:#712B13}
.arr{color:var(--muted);font-weight:700}
button.rel-link{padding:2px 10px;border-radius:6px;font-size:.82rem;font-family:inherit}
button.rel-link:hover{background:var(--green-dark)}
.rel p{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.rel code{font-size:.82rem;color:var(--ink)}
.chain{margin:12px 0 0;font-size:.9rem}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.fbox{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.farrow{color:var(--muted);font-size:.9rem}

/* Mode présentation */
#slides{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#slides.on{display:flex}
#slides .top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
#slides .top .count{flex:1;color:var(--muted)}
#slide{flex:1;overflow:auto;padding:32px 16px}
#slide .inner{max-width:980px;margin:0 auto;font-size:1.12rem}
#slide h2{font-size:2rem;margin:6px 0 4px;color:var(--green-dark)}
#slide .num{color:var(--muted);font-weight:600}
.hint{color:var(--muted);font-size:.85rem;text-align:center;padding:8px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="logo"><b>G</b> Green Goodies</span>
    <h1>Timeline du projet</h1>
    <p class="sub">Site e-commerce et API avec Symfony – Projet OpenClassrooms (option B, cas fictif)</p>
    <div class="tags">
      <span>Symfony 7.4 LTS</span><span>PHP 8.3</span><span>PostgreSQL</span><span>Twig</span><span>Doctrine</span><span>JWT (lexik)</span>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="progress">
      <small id="progressText"></small>
      <div class="track"><div class="fill" id="progressFill"></div></div>
    </div>
    <button class="ghost" id="toggleAll">Tout déplier</button>
    <button id="present">▶ Présenter (P)</button>
  </div>
</div>

<main class="wrap">
  <div class="timeline" id="timeline"></div>
</main>

<div id="slides" role="dialog" aria-label="Mode présentation">
  <div class="top">
    <span class="count" id="slideCount"></span>
    <button class="ghost" id="prev">← Précédent</button>
    <button class="ghost" id="next">Suivant →</button>
    <button id="close">✕ Fermer</button>
  </div>
  <div id="slide"></div>
  <div class="hint">Flèches ← → pour naviguer · Échap pour quitter</div>
</div>

<script>
/* =========================================================
   DONNÉES : une entrée par étape (ajoutée au fil du projet)
   statut : "done" (faite), "current" (en cours), "todo" (prévue)
   ========================================================= */
const STEPS = [
{
  titre: "Créer le projet Symfony",
  statut: "done",
  date: "27/11/2026",
  objectif: "Créer le squelette de l'application GreenGoodies et vérifier qu'il fonctionne sur le poste de développement.",
  commandes: [
    ["symfony new greengoodies --webapp --version=7.4", "Crée le projet, installe les paquets d'une application web et initialise Git."],
    ["symfony check:requirements", "Vérifie que PHP et ses extensions conviennent à Symfony."],
    ["symfony serve -d", "Lance le serveur web local en arrière-plan sur http://127.0.0.1:8000."],
    ["symfony console about", "Affiche la version de Symfony et de PHP du projet."]
  ],
  fichiers: [
    "composer.json : la liste des paquets du projet",
    "src/ : le code PHP (contrôleurs, entités…)",
    "templates/ : les vues Twig",
    "config/ : la configuration (dont security.yaml)",
    "public/index.php : le front controller, seule porte d'entrée",
    ".env : les variables d'environnement par défaut",
    ".gitignore : vendor/, var/ et .env.local ne sont pas versionnés"
  ],
  resultat: [
    "Symfony 7.4.24 avec PHP 8.3.33",
    "Prérequis : OK (extension pdo_pgsql présente pour PostgreSQL)",
    "Dépôt Git créé avec 2 commits automatiques : « Add initial set of files » et « Add webapp packages »",
    "Page d'accueil de Symfony affichée sur http://127.0.0.1:8000"
  ],
  pourquoi: [
    "Symfony 7.4 est la version LTS (support à long terme) : le choix sûr pour un projet professionnel, compatible avec PHP 8.3.",
    "L'option --webapp installe d'un coup Twig, Doctrine, les formulaires, la sécurité et le MakerBundle : tout ce que demande un site e-commerce.",
    "Un seul projet pour le site et l'API, comme le demande la cliente (« ne t'embête pas à créer deux projets Symfony différents »)."
  ],
  cours: ["Partie 1, chapitre 2 : Installez Symfony", "Symfony CLI", "Composer & Flex", "Structure du projet"],
  questions: [
    ["Pourquoi Symfony 7.4 et pas la 8 ?", "La 7.4 est la LTS, maintenue plus longtemps, et la 8 demande PHP 8.4."],
    ["À quoi sert public/index.php ?", "C'est le front controller : toutes les requêtes passent par lui, il démarre le Kernel qui trouve la route et appelle le contrôleur."]
  ]
},
{
  titre: "Publier le code sur GitHub",
  statut: "done",
  date: "27/11/2026",
  objectif: "Héberger le code sur GitHub, comme le demandent les spécifications, et pouvoir le montrer à l'évaluateur.",
  commandes: [
    ["git add docs/\ngit commit -m \"Ajout de la timeline du projet\"", "Enregistre la timeline dans l'historique Git (commit)."],
    ["git remote add origin https://github.com/adeloppeur/greengoodies.git", "Indique à Git où se trouve la copie en ligne (le « remote » nommé origin)."],
    ["git push -u origin master", "Envoie les commits sur GitHub ; -u relie la branche locale à celle de GitHub pour les prochains push."]
  ],
  fichiers: [
    ".gitignore : créé par symfony new, il exclut vendor/, var/ et .env.local (secrets)",
    "docs/timeline.html : ce support de présentation"
  ],
  resultat: [
    "Dépôt public : https://github.com/adeloppeur/greengoodies",
    "3 commits en ligne sur la branche master",
    "Aucun secret publié : .env.local n'est jamais versionné"
  ],
  pourquoi: [
    "Les spécifications imposent un code « versionné avec Git et hébergé sur GitHub ».",
    "Un commit à la fin de chaque étape, avec un message clair : l'historique raconte la construction du projet et sert de filet de sécurité.",
    "Dépôt public pour que l'évaluateur puisse le consulter."
  ],
  cours: ["Versionner son projet avec Git (Partie 1, chapitre 2)", "Environnements & .env : .env.local non versionné"],
  questions: [
    ["Où sont les mots de passe de la base ?", "Dans .env.local, sur le poste uniquement : il est exclu par .gitignore, donc jamais publié sur GitHub."],
    ["Pourquoi des petits commits ?", "Chaque commit correspond à une étape qui fonctionne : on peut revenir en arrière et l'historique est lisible."]
  ]
},
{
  titre: "Base de données",
  statut: "done",
  date: "27/11/2026",
  objectif: "Relier l'application à PostgreSQL et créer la base vide greengoodies.",
  commandes: [
    ["DATABASE_URL=\"postgresql://postgres:********@127.0.0.1:5432/greengoodies?serverVersion=18&charset=utf8\"", "Ligne écrite dans .env.local : la plateforme, l'utilisateur, le mot de passe, l'hôte (le poste), le port, le nom de la base et la version du serveur."],
    ["symfony console doctrine:database:create", "Doctrine se connecte à PostgreSQL et crée la base greengoodies."],
    ["symfony console dbal:run-sql \"SELECT current_database(), version()\"", "Vérifie la connexion : la base répond."]
  ],
  fichiers: [
    ".env.local : DATABASE_URL avec le mot de passe, propre au poste",
    ".env : valeurs par défaut sans secret, versionnées",
    "config/packages/doctrine.yaml : lit DATABASE_URL"
  ],
  resultat: [
    "Base greengoodies créée sur PostgreSQL 18.6",
    "Connexion vérifiée depuis Symfony",
    ".env.local ignoré par Git : le mot de passe n'est pas sur GitHub"
  ],
  pourquoi: [
    "PostgreSQL est le SGBDR utilisé dans le cours ; les données de GreenGoodies (utilisateurs, produits, commandes) sont liées entre elles, d'où une base relationnelle.",
    "Le DSN est dans .env.local et pas dans .env : .env est versionné, .env.local reste sur le poste. Aucun secret n'est publié.",
    "serverVersion=18 indique à Doctrine la version exacte du serveur, pour générer un SQL adapté."
  ],
  cours: ["Doctrine : connexion à la base", "Environnements & .env", "SGBDR et DSN (Partie 2)"],
  questions: [
    ["Quelle différence entre .env et .env.local ?", ".env contient les valeurs par défaut et est versionné ; .env.local les surcharge sur le poste et n'est jamais publié."],
    ["Pourquoi une base relationnelle ?", "Les commandes sont liées aux utilisateurs et aux produits : les relations (clés étrangères) garantissent la cohérence des données."]
  ]
},
{
  titre: "Entités et fixtures",
  statut: "done",
  date: "27/11/2026",
  objectif: "Créer les 4 tables de la base (comme 4 feuilles Excel reliées entre elles), puis les remplir avec des données de démonstration.",
  schema: `
    <p class="schema-intro">La base = un classeur, chaque entité = une feuille. Les pastilles de couleur sont les liens entre les feuilles (comme une RECHERCHEV). Exemple : Marie a une commande validée (n°12) et un panier en cours (n°13). À droite de chaque feuille : ses relations. Clique sur le nom d'une entité (bouton vert) pour aller voir sa feuille.</p>
    <div class="erows">

      <div class="erow" data-entity="User">
        <div class="sheet"><h4>User <small>table user · les clients</small></h4><table>
          <tr><th>id</th><th>firstname</th><th>email</th><th>api_active</th></tr>
          <tr><td><span class="pill u">1</span></td><td>Marie</td><td>marie@mail.fr</td><td>false</td></tr>
          <tr><td><span class="pill u">2</span></td><td>Test</td><td>test@greengoodies.fr</td><td>false</td></tr></table></div>
        <div class="rels"><h5>Relations</h5>
          <div class="rel">
            <span class="kind">OneToMany · côté inverse</span>
            <div class="rel-line"><span class="col u">user.id</span><span class="arr">←</span><button class="rel-link" data-target="Order">Order</button><span class="col u">.customer_id</span></div>
            <p>Un client → plusieurs commandes. Aucune colonne dans user : <code>$user->getOrders()</code> va chercher les commandes dont customer_id vaut son id. orphanRemoval : supprimer le client supprime ses commandes.</p>
          </div>
        </div>
      </div>

      <div class="erow" data-entity="Product">
        <div class="sheet"><h4>Product <small>table product · le catalogue</small></h4><table>
          <tr><th>id</th><th>name</th><th>price</th><th>picture</th></tr>
          <tr><td><span class="pill p">1</span></td><td>Kit d'hygiène</td><td>24.99</td><td>kit.webp</td></tr>
          <tr><td><span class="pill p">2</span></td><td>Shot tropical</td><td>4.5</td><td>shot.webp</td></tr>
          <tr><td><span class="pill p">3</span></td><td>Gourde en bois</td><td>16.9</td><td>gourde.webp</td></tr></table></div>
        <div class="rels none"><h5>Relations</h5>
          <div class="rel">
            <span class="kind">aucune propriété dans Product</span>
            <div class="rel-line"><span class="col p">product.id</span><span class="arr">←</span><button class="rel-link" data-target="OrderItem">OrderItem</button><span class="col p">.product_id</span></div>
            <p>Les lignes de commande pointent vers le produit, mais Product ne les connaît pas : on n'a jamais besoin de partir d'un produit pour trouver ses commandes.</p>
          </div>
        </div>
      </div>

      <div class="erow" data-entity="Order">
        <div class="sheet"><h4>Order <small>table order · les commandes</small></h4><table>
          <tr><th>id</th><th>customer_id</th><th>status</th><th>validated_at</th></tr>
          <tr><td><span class="pill o">12</span></td><td><span class="pill u">1</span></td><td><span class="st ok">validated</span></td><td>25/11/2026</td></tr>
          <tr><td><span class="pill o">13</span></td><td><span class="pill u">1</span></td><td><span class="st cart">cart</span></td><td>null</td></tr></table></div>
        <div class="rels"><h5>Relations</h5>
          <div class="rel">
            <span class="kind">ManyToOne · porte la colonne</span>
            <div class="rel-line"><span class="col u">order.customer_id</span><span class="arr">→</span><button class="rel-link" data-target="User">User</button><span class="col u">.id</span></div>
            <p>Plusieurs commandes → un client. Obligatoire (nullable: false). onDelete CASCADE : si le client est supprimé, PostgreSQL supprime ses commandes.</p>
          </div>
          <div class="rel">
            <span class="kind">OneToMany · côté inverse</span>
            <div class="rel-line"><span class="col o">order.id</span><span class="arr">←</span><button class="rel-link" data-target="OrderItem">OrderItem</button><span class="col o">.parent_order_id</span></div>
            <p>Une commande → plusieurs lignes : <code>$order->getItems()</code>. orphanRemoval : une ligne retirée est supprimée (« Vider le panier »).</p>
          </div>
        </div>
      </div>

      <div class="erow" data-entity="OrderItem">
        <div class="sheet"><h4>OrderItem <small>table order_item · le détail</small></h4><table>
          <tr><th>parent_order_id</th><th>product_id</th><th>quantity</th><th>unit_price</th></tr>
          <tr><td><span class="pill o">12</span></td><td><span class="pill p">3</span></td><td>1</td><td>16.9</td></tr>
          <tr><td><span class="pill o">12</span></td><td><span class="pill p">2</span></td><td>2</td><td>4.5</td></tr>
          <tr><td><span class="pill o">13</span></td><td><span class="pill p">1</span></td><td>1</td><td>24.99</td></tr></table></div>
        <div class="rels"><h5>Relations</h5>
          <div class="rel">
            <span class="kind">ManyToOne · porte la colonne</span>
            <div class="rel-line"><span class="col o">order_item.parent_order_id</span><span class="arr">→</span><button class="rel-link" data-target="Order">Order</button><span class="col o">.id</span></div>
            <p>Plusieurs lignes → une commande. onDelete CASCADE : la commande supprimée emporte ses lignes.</p>
          </div>
          <div class="rel">
            <span class="kind">ManyToOne · porte la colonne</span>
            <div class="rel-line"><span class="col p">order_item.product_id</span><span class="arr">→</span><button class="rel-link" data-target="Product">Product</button><span class="col p">.id</span></div>
            <p>Plusieurs lignes → un produit. Pas de cascade : supprimer une commande ne retire jamais un produit du catalogue.</p>
          </div>
        </div>
      </div>

    </div>
    <p class="chain">Suppression en chaîne (« Supprimer mon compte ») : <b>user</b> → <b>order</b> → <b>order_item</b>. Les produits restent.</p>
    <div class="flow">
      <span class="fbox">Ajouter au panier</span><span class="farrow">→</span>
      <span class="fbox cart">Commande « panier »</span><span class="farrow">→ Valider →</span>
      <span class="fbox ok">Commande « validée » + date</span><span class="farrow">→</span>
      <span class="fbox">Visible dans Mon compte</span>
    </div>`,
  plan: [
    "✓ make:user puis make:entity User : email, mot de passe haché, prénom, nom, apiActive (false par défaut) ; table user créée",
    "✓ make:entity Product : name, shortDescription, fullDescription (text), price (float), picture ; table product créée",
    "✓ make:entity Order : relation customer → User (ManyToOne), status (cart / validated), validatedAt ; table order créée",
    "✓ make:entity OrderItem : relations parentOrder → Order et product → Product, quantity, unitPrice ; table order_item créée",
    "✓ Une migration par table : make:migration puis doctrine:migrations:migrate (4 migrations)",
    "✓ symfony composer require orm-fixtures zenstruck/foundry --dev (partie 3, chapitre 5 du cours)",
    "✓ make:factory Product et User ; Faker en français (fr_FR) ; UserFactory hache le mot de passe (afterInstantiate)",
    "✓ AppFixtures : les 9 produits de la maquette Figma + le compte test@greengoodies.fr / password (API désactivée)",
    "✓ doctrine:fixtures:load : 9 produits et 1 compte en base, mot de passe haché ($2y$13$…)"
  ],
  pourquoi: [
    "Le panier est une commande au statut « panier » : pas de table en plus ; à la validation elle passe à « validée » avec une date.",
    "OrderItem garde le prix payé : une ancienne commande ne change pas si le prix d'un produit change.",
    "Les champs de Product reprennent exactement le schéma Product de l'API (name, shortDescription, fullDescription, price, picture).",
    "Supprimer un utilisateur supprime ses commandes (bouton « Supprimer mon compte »).",
    "user et order sont des mots réservés en SQL : le Maker les entoure d'accents graves (`user`, `order`) ; il refuse aussi user et order comme noms de propriété, d'où customer et parentOrder.",
    "Les totaux (ligne et commande) ne sont pas stockés : getTotal() les calcule à partir des lignes.",
    "Fixtures = la recette écrite une fois : une commande remplit la même base sur n'importe quel PC (perso, pro, correcteur).",
    "Produits repris de la maquette plutôt qu'inventés par Faker : le site ressemble aux maquettes et chaque produit a sa photo.",
    "Pas de gestion des produits dans l'énoncé : en production, le catalogue viendrait d'un back-office."
  ]
},

/* =========================================================
   AFFICHAGE
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LABEL = {done:"Fait", current:"En cours", todo:"À venir"};

function list(items){ return "<ul>" + items.map(i => "<li>" + esc(i) + "</li>").join("") + "</ul>"; }

function detail(s){
  if (!s.commandes && s.plan) return `
    <p class="goal"><strong>Objectif :</strong> ${esc(s.objectif)}</p>
    ${s.schema ? `<div class="box full schema">${s.schema}</div>` : ""}
    <div class="grid" style="margin-top:14px">
      <div class="box"><h3>Ce qui va être fait</h3>${list(s.plan)}</div>
      <div class="box"><h3>Pourquoi ces choix</h3>${list(s.pourquoi || [])}</div>
    </div>`;
  if (!s.commandes) return `<p class="goal">${esc(s.objectif)}</p>`;
  let cmds = s.commandes.map(([c, n]) => `<pre>${esc(c)}</pre><p class="cmd-note">${esc(n)}</p>`).join("");
  let qa = (s.questions || []).map(([q, r]) => `<dt>${esc(q)}</dt><dd>${esc(r)}</dd>`).join("");
  return `
    <p class="goal"><strong>Objectif :</strong> ${esc(s.objectif)}</p>
    <div class="grid">
      <div class="box full"><h3>Commandes</h3>${cmds}</div>
      <div class="box"><h3>Fichiers clés</h3>${list(s.fichiers)}</div>
      <div class="box"><h3>Résultat</h3>${list(s.resultat)}</div>
      <div class="box full"><h3>Pourquoi ces choix</h3>${list(s.pourquoi)}</div>
      <div class="box"><h3>Notions du cours</h3>${list(s.cours)}</div>
      ${qa ? `<div class="box"><h3>Questions possibles en soutenance</h3><dl class="qa">${qa}</dl></div>` : ""}
    </div>`;
}

function render(){
  $("#timeline").innerHTML = STEPS.map((s, i) => `
    <section class="step ${s.statut}${s.statut === "current" ? " open" : ""}" data-i="${i}">
      <span class="dot">${s.statut === "done" ? "✓" : i + 1}</span>
      <div class="card">
        <button class="head" aria-expanded="false">
          <h2>${i + 1}. ${esc(s.titre)}</h2>
          ${s.date ? `<span class="date">${esc(s.date)}</span>` : ""}
          <span class="badge">${LABEL[s.statut]}</span>
          <span class="chev">›</span>
        </button>
        <div class="body">${detail(s)}</div>
      </div>
    </section>`).join("");

  document.querySelectorAll(".step .head").forEach(h => h.addEventListener("click", () => {
    const st = h.closest(".step"); st.classList.toggle("open");
    h.setAttribute("aria-expanded", st.classList.contains("open"));
  }));

  const done = STEPS.filter(s => s.statut === "done").length;
  $("#progressText").textContent = `${done} étape${done > 1 ? "s" : ""} terminée${done > 1 ? "s" : ""} sur ${STEPS.length}`;
  $("#progressFill").style.width = (done / STEPS.length * 100) + "%";
}
function lastDone(){ let k = -1; STEPS.forEach((s, i) => { if (s.statut === "done") k = i; }); return k; }

/* Clic sur une entité liée : on va voir sa feuille dans le même schéma */
document.addEventListener("click", e => {
  const link = e.target.closest(".rel-link");
  if (!link) return;
  const scope = link.closest(".schema") || document;
  const row = scope.querySelector(`.erow[data-entity="${link.dataset.target}"]`);
  if (!row) return;
  row.scrollIntoView({behavior: "smooth", block: "center"});
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
});

$("#toggleAll").addEventListener("click", e => {
  const steps = document.querySelectorAll(".step");
  const open = [...steps].some(s => !s.classList.contains("open"));
  steps.forEach(s => s.classList.toggle("open", open));
  e.target.textContent = open ? "Tout replier" : "Tout déplier";
});

/* =========================================================
   MODE PRÉSENTATION
   ========================================================= */
let cur = 0;
function show(i){
  cur = Math.max(0, Math.min(STEPS.length - 1, i));
  const s = STEPS[cur];
  $("#slide").innerHTML = `<div class="inner">
    <span class="num">Étape ${cur + 1} / ${STEPS.length} · ${LABEL[s.statut]}</span>
    <h2>${esc(s.titre)}</h2>${detail(s)}</div>`;
  $("#slideCount").textContent = `GreenGoodies · étape ${cur + 1} sur ${STEPS.length}`;
  $("#slide").scrollTop = 0;
}
function openSlides(){ show(Math.max(0, lastDone())); $("#slides").classList.add("on"); }
function closeSlides(){ $("#slides").classList.remove("on"); }

$("#present").addEventListener("click", openSlides);
$("#close").addEventListener("click", closeSlides);
$("#prev").addEventListener("click", () => show(cur - 1));
$("#next").addEventListener("click", () => show(cur + 1));
document.addEventListener("keydown", e => {
  const on = $("#slides").classList.contains("on");
  if (!on && (e.key === "p" || e.key === "P")) { openSlides(); return; }
  if (!on) return;
  if (e.key === "ArrowRight" || e.key === " ") show(cur + 1);
  else if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "Escape") closeSlides();
});

render();
</script>
</body>
